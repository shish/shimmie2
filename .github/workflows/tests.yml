name: Tests

on:
  push:
    branches:
      - main
      - master
      - branch-2.*
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sundays at 02:00
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build and publish
        required: true
        type: string

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: php-cs-fixer-${{ hashFiles('composer.lock') }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
      - run: composer validate
      - run: composer install --prefer-dist --no-progress
      - run: composer format-ci

  static:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: phpstan-${{ hashFiles('composer.lock') }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
      - run: composer install --prefer-dist --no-progress
      - run: composer analyse-ci

  upgrade:
    name: Upgrade from 2.9 ${{ matrix.database }}
    strategy:
      matrix:
        php: ["8.5"]
        database: ["pgsql", "mysql", "sqlite"]
    runs-on: ubuntu-24.04
    steps:
      # Environment setup
      - name: Checkout current
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
          fetch-depth: 0
      - name: Set Up Cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Set up database
        run: ./.github/setup-db.sh "${{ matrix.database }}"
      # Old version
      - name: Checkout old
        run: git checkout branch-2.9
      - name: Install old
        run: |
          composer install --no-progress
          php index.php
          cat data/config/shimmie.conf.php
      - name: Check old
        run: |
          php index.php get-page / > old.out
          grep -q 'Welcome to Shimmie 2.9' old.out || (cat old.out && false)
          rm -f old.out
      # Current version
      - name: Checkout current
        run: git checkout ${{ inputs.ref_name || github.head_ref || github.ref }}
      - name: Install current
        run: |
          composer install --no-progress
          php index.php db-upgrade
      - name: Check current
        env:
          TARGET_REF: ${{ inputs.ref_name || github.ref_name }}
        run: |
          expected_version=2.13
          if [[ "$TARGET_REF" =~ ^branch-([0-9]+\.[0-9]+)$ ]]; then
            expected_version="${BASH_REMATCH[1]}"
          elif [[ "$TARGET_REF" =~ ^v([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            expected_version="${BASH_REMATCH[1]}"
          fi
          php index.php page:get / > new.out
          grep -Fq "Welcome to Shimmie $expected_version" new.out || (cat new.out && false)
  test:
    name: PHP ${{ matrix.php }} / DB ${{ matrix.database }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5"]
        database: ["pgsql", "mysql", "sqlite"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          extensions: mbstring
          ini-file: development
      - run: ./.github/setup-db.sh "${{ matrix.database }}"
      - run: php -v && composer -V
      - run: composer validate
      - uses: mfinelli/setup-imagemagick@v8
      - run: composer install --no-progress
      - run: composer test

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs:
      - format
      - static
      - upgrade
      - test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/branch-2') || startsWith(github.ref, 'refs/tags/v2')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # buildx is needed for multi-architecture builds
      - uses: docker/setup-buildx-action@v4
      # Figure out some variables to get baked into the image
      - name: Set build vars
        id: get-vars
        run: |
          echo "BUILD_TIME=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV
          echo "BUILD_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
      # build and push an anonymous image
      - uses: docker/build-push-action@v7
        id: build
        with:
          platforms: ${{ matrix.platform }}
          tags: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_TIME=${{ env.BUILD_TIME }}
            BUILD_HASH=${{ env.BUILD_HASH }}
      # record the image's ID in /tmp/digests/<image_id>
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      # upload the contents of /tmp/digests
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs:
      - build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/branch-2') || startsWith(github.ref, 'refs/tags/v2')
    steps:
      # full checkout with tags so that get-tags.py can get the version number
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_name || github.ref }}
          fetch-tags: true
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # get all files in /tmp/digests
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      # buildx is needed to create manifest lists
      - uses: docker/setup-buildx-action@v4
      # create a manifest based on /tmp/digests/*
      # the result of this command should look like
      #   docker buildx imagetools create \
      #     -t shish2k/shimmie2:2.5.1 -t shish2k/shimmie2:2.5 -t shish2k/shimmie2:2 \
      #     shish2k/shimmie2@sha256:<amd64 digest> shish2k/shimmie2@sha256:<arm64 digest>
      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            $(printf -- "-t ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE }}:%s " $(./.github/get-tags.py)) \
            $(printf -- '${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE }}@sha256:%s ' $(ls -1 ${{ runner.temp }}/digests))
